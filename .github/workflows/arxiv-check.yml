name: arXiv check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  arxiv-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check arXiv requirements
        run: python check_arxiv.py
